on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    uses: zmkfirmware/zmk/.github/workflows/build-user-config.yml@main

  # Schéma des layers (SVG + ASCII), publié en artefact à côté du firmware.
  draw-keymap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - name: Installation de keymap-drawer
        run: pip install -r scripts/requirements.txt
      - name: Génération du schéma
        run: python scripts/draw_keymap.py --out-dir keymap-drawer
      - uses: actions/upload-artifact@v4
        with:
          name: keymap-drawing
          path: |
            keymap-drawer/sofle.svg
            keymap-drawer/sofle.txt
